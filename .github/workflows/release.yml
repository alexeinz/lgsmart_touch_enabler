name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app and DMG
        env:
          # Tag builds are named after the tag; manual runs fall back to the latest tag or 0.0.0.
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          ./scripts/build-app.sh
          ./scripts/make-dmg.sh
          cd build && shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LG-Smart-Touch-Enabler-dmg
          path: |
            build/*.dmg
            build/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.dmg build/SHA256SUMS.txt \
            --title "LG Smart Touch Enabler $GITHUB_REF_NAME" --generate-notes
